<style>
  :root {
    --color-danger:      #c40000;
    --color-danger-dark: #9a0000;
    --color-yellow:      #ffb400;
    --color-white:       #ffffff;
    --color-text:        #14161a;
    --font-base: 'Inter', 'Segoe UI', Arial, Helvetica, sans-serif;
    --container-width: 640px;
    --radius: 12px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-base);
    background-color: var(--color-white);
    color: var(--color-text);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: var(--container-width);
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Hero */
  .alert-bar {
    background: linear-gradient(160deg, var(--color-danger) 0%, var(--color-danger-dark) 100%);
    color: var(--color-white);
    text-align: center;
    padding: 26px 0 24px;
  }

  .alert-bar h1 {
    font-size: clamp(1.5rem, 6vw, 2.2rem);
    font-weight: 900;
    line-height: 1.2;
  }

  .hero-text {
    text-align: center;
    padding: 28px 0 10px;
  }

  .hero-text h2 {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    font-weight: 900;
    color: var(--color-text);
  }

  .hero-text .look-down {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 900;
    color: var(--color-yellow);
    margin-top: 6px;
  }

  .hero-text .look-down .emoji {
    display: inline-block;
    animation: bounce 1.4s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-text .look-down .emoji { animation: none; }
  }

  /* Vídeo */
  .video-zone {
    max-width: 400px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  /* Checkout Hotmart
     Oculto por padrão — exibido aos 28.16s do vídeo, após o play */
  .checkout-zone {
    max-width: 440px;
    margin: 28px auto 0;
    padding: 0 20px 56px;
    display: none;
  }

  .checkout-zone.is-visible {
    display: block;
    animation: fade-in-up 0.6s ease-out both;
  }

  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <header class="alert-bar">
    <div class="container">
      <h1>¡Espera un momento!</h1>
    </div>
  </header>

  <section class="hero-text">
    <div class="container">
      <h2>Esto es solo para ti.</h2>
      <p class="look-down">Mira abajo <span class="emoji">👇</span></p>
    </div>
  </section>

  <!-- ===== VÍDEO ===== -->
  <div class="video-zone">
    <vturb-smartplayer id="vid-6a4c64008c0d6307c70b394c" style="display: block; margin: 0 auto; width: 100%; max-width: 400px;"><div class="vturb-player-placeholder" style="position: relative; width: 100%; padding: 133.33333333333331% 0 0; z-index: 0; background-color: black;"></div></vturb-smartplayer>
    <script type="text/javascript"> var s=document.createElement("script"); s.src="https://scripts.converteai.net/b4d92c20-2920-493b-982b-7f8dd3923ccb/players/6a4c64008c0d6307c70b394c/v4/player.js", s.async=!0,document.head.appendChild(s); </script>
  </div>
  <!-- ===== /VÍDEO ===== -->

  <!-- HOTMART - Sales Funnel Widget -->
  <div class="checkout-zone">
    <!--- sales funnel container --->
    <div id="hotmart-sales-funnel"></div>
  </div>
  <!-- HOTMART - Sales Funnel Widget -->

  <!--- script load and setup --->
  <script src="https://checkout.hotmart.com/lib/hotmart-checkout-elements.js"></script>
  <script>
    checkoutElements.init('salesFunnel').mount('#hotmart-sales-funnel')
  </script>

  <!-- Exibe o botão da Hotmart aos 28.16s do vídeo (após o play) -->
  <script>
    (function () {
      "use strict";

      var CTA_TIME_SECONDS = 28.16;
      var MAX_ATTEMPTS = 30; // ~30s aguardando o player carregar

      var cta = document.querySelector(".checkout-zone");
      var ctaDisplayed = false;

      function showCta() {
        if (ctaDisplayed || !cta) return;
        ctaDisplayed = true;
        cta.classList.add("is-visible");
      }

      function watchProgress(attempt) {
        // Aguarda a lib do VTurb registrar a instância do player
        if (
          typeof smartplayer === "undefined" ||
          !smartplayer.instances ||
          !smartplayer.instances.length
        ) {
          if (attempt >= MAX_ATTEMPTS) return;
          return setTimeout(function () {
            watchProgress(attempt + 1);
          }, 1000);
        }

        var player = smartplayer.instances[0];

        player.on("timeupdate", function () {
          if (ctaDisplayed) return;
          if (!player.video) return;
          if (player.video.currentTime >= CTA_TIME_SECONDS) showCta();
        });
      }

      watchProgress(0);
    })();
  </script>
</body>
</html>
